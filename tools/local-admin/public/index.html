<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>本地文章管理 · ManaFeng</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <aside class="sidebar">
    <a href="/" class="brand">ManaFeng<span>本地文章管理</span></a>
    <nav aria-label="管理导航">
      <button data-page="posts" aria-current="page"><span>文章</span><b id="count-posts">—</b></button>
      <button data-page="categories"><span>分类</span><b id="count-categories">—</b></button>
      <button data-page="tags"><span>标签</span><b id="count-tags">—</b></button>
      <button data-page="media"><span>图片</span><b id="count-media">—</b></button>
    </nav>
    <p class="sidebar-note">保存到这台电脑<br>不自动上传或发布</p>
  </aside>
  <div class="workspace">
    <header class="topbar"><span class="local-badge">● 仅本机保存</span><a href="http://127.0.0.1:4317/" target="_blank" rel="noopener noreferrer">打开网站预览 ↗</a></header>
    <main id="main" tabindex="-1"><p>正在读取本地内容…</p></main>
  </div>
  <div id="message" role="status" aria-live="polite" hidden></div>
  <dialog id="create-dialog">
    <form id="create-form">
      <h2>新建文章</h2><p class="muted">先创建本地文件，再编辑正文。</p>
      <label>标题<input name="title" required maxlength="300"></label>
      <label>文件短名<input name="slug" required pattern="[a-z0-9][a-z0-9-]{0,99}" placeholder="例如 my-new-post"></label>
      <p class="hint">使用小写英文、数字和连字符。创建后固定，保护文章地址。</p>
      <label>分类<input name="category" list="category-options" required></label>
      <div class="dialog-actions"><button type="button" data-close="create-dialog">取消</button><button class="primary" type="submit">创建本地文章</button></div>
    </form>
  </dialog>
  <dialog id="term-dialog">
    <form id="term-form">
      <h2 id="term-heading">改名</h2><p id="term-description" class="muted"></p>
      <label>新名称<input name="name" required maxlength="80"></label>
      <p class="hint">新名称如果已存在，会合并到同一名称。正文和文章地址保持不变；分类、标签自身的导航地址会随名称变化。</p>
      <div class="dialog-actions"><button type="button" data-close="term-dialog">取消</button><button class="primary" type="submit">确认改名或合并</button></div>
    </form>
  </dialog>
  <datalist id="category-options"></datalist>
</body>
</html>
